[package]
name = "pq-sig-bench"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Signature benchmarks for the post-quantum schemes proposed for fastcrypto"

[workspace]

[dependencies]
# Ed25519 baseline and the FN-DSA-512 row. `falcon-sign` exposes keygen/sign;
# verify is always available through the in-crate strict verifier.
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", branch = "mahdi/fn-dsa-512", features = ["falcon-sign"] }

# FN-DSA-1024 row, plus the interop oracle the FN-DSA-512 self-check runs
# against. default-features = false matches fastcrypto's own configuration
# (portable "clean" C, no NEON/AVX2); cargo unifies features per crate, so a
# default-features dep here would silently swap the SIMD build into
# fastcrypto's sign path too.
pqcrypto-falcon = { version = "0.4", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"

# ML-DSA-44/65/87 rows (mldsa-native C imported by AWS-LC, behind `unstable`).
aws-lc-rs = { version = "1.17", features = ["unstable"] }

# The `mldsa65` bin's other contender: our own wrapper around the same
# mldsa-native C, from the sibling checkout so it benchmarks the working tree.
# TODO: replace it with the git link once it is public
mysten-mldsa-native-rs = { path = "../mysten-mldsa-native-rs" }
rand = "0.8.5"

# QoS pinning for the `mldsa65` bin: keeps the timing thread on the
# performance cores, the main source of run-to-run drift on Apple Silicon.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
default = ["mysten-native"]
mysten-native = ["mysten-mldsa-native-rs/native"]
