[package]
name = "pq-sig-bench"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Signature benchmarks for the post-quantum schemes in the fastcrypto pq-schemes branch"

[workspace]

[dependencies]
fastcrypto = { git = "https://github.com/mahdi-mysten/fastcrypto", branch = "pq-schemes" }
# Keygen/sign source for the Falcon rows, and the producer of the one padded
# signature both Falcon rows are timed against.
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"

# ML-DSA-44 rows: four independent implementations of the same FIPS 204
# byte format, all verifying one shared (pk, sig) pair.
libcrux-ml-dsa = { version = "0.0.9", default-features = false, features = ["mldsa44"] }
ml-dsa = "0.1.1"
fips204 = { version = "0.4.6", default-features = false, features = ["default-rng", "ml-dsa-44"] }
pqcrypto-mldsa = "0.1"
rand = "0.8.5"
aws-lc-rs = { version = "1.17", features = ["unstable"] }

