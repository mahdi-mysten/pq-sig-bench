[package]
name = "pq-sig-bench"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Signature benchmarks for the post-quantum schemes proposed for fastcrypto"

[workspace]

[dependencies]
# Ed25519 baseline and the SLH-DSA-SHA2-128s row (sphincs module, behind
# `experimental`). This branch carries the top-level FIPS 205 sign/verify
# plus NIST ACVP KATs; upstream main's sphincs has only the FORS/XMSS/
# hypertree building blocks, with no way to run the full scheme. The branch
# has no falcon module, so both FN-DSA rows come from pqcrypto-falcon below.
fastcrypto = { git = "https://github.com/mahdi-mysten/fastcrypto", branch = "feat/slh-dsa-toplevel", features = ["experimental"] }

# Both FN-DSA rows: PQClean's portable "clean" C in the padded fixed-size
# signature format. default-features = false keeps SIMD off (no NEON/AVX2),
# matching the configuration fastcrypto ships.
pqcrypto-falcon = { version = "0.4", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"

# ML-DSA-65 contender in section 2 of the report (mldsa-native C imported by
# AWS-LC, behind `unstable`), and the cross-verification oracle for the
# wrapper rows.
aws-lc-rs = { version = "1.17", features = ["unstable"] }

# The ML-DSA rows: our own crate around the same mldsa-native C. Tracks the
# multilevel branch because the 44/87 feature gates live there. Point it back
# at `path = "../mysten-mldsa-native-rs"` to bench the working tree instead.
mysten-mldsa-native-rs = { git = "https://github.com/MystenLabs/mysten-mldsa-native-rs.git", branch = "mahdi/multilevel-v2", features = ["mldsa44", "mldsa87"] }
rand = "0.8.5"

# The remaining ML-DSA-65 contenders for section 2: RustCrypto pure Rust,
# Cryspen's libcrux, and PQClean's reference C behind bindings.
ml-dsa = "0.1.1"
libcrux-ml-dsa = "0.0.10"
pqcrypto-mldsa = "0.1.2"

# Measurement plumbing: sched_setaffinity + perf_event_open/rdpmc on Linux,
# the QoS performance-core pin on macOS (there is no core pinning there).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[features]
default = ["mysten-native"]
mysten-native = ["mysten-mldsa-native-rs/native"]
